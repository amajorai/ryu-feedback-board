[package]
name = "ryu-feedback-board"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Feedback Board: a public request board and private Ryu product workspace with configurable AI triage and build workflows."
repository = "https://github.com/amajorai/ryu"

[[bin]]
name = "ryu-feedback-board"
path = "src/main.rs"

[dependencies]
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.2.6" }
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
